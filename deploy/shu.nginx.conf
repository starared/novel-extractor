server {
    listen 80;
    listen [::]:80;
    server_name shu.starared.win;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shu.starared.win;
    ssl_certificate /etc/letsencrypt/live/shu.starared.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shu.starared.win/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    auth_basic "Shujing";
    auth_basic_user_file /etc/nginx/shu.htpasswd;
    client_max_body_size 0;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://127.0.0.1:49152;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}
